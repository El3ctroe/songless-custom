<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Songless</title>
<style>
:root{--bg:#0e1013;--card:#171a20;--line:#262b33;--text:#eceff3;--mut:#8b94a3;--acc:#1ed760;--bad:#ff5d6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:0;letter-spacing:.5px;flex:1}
h1 span{color:var(--acc)}
main{max-width:640px;margin:0 auto;padding:0 20px 60px}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2{margin:0 0 8px;font-size:18px}
.muted{color:var(--mut);font-size:14px}
button{font:inherit;color:var(--text);background:#232831;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}
button:hover:not(:disabled){border-color:#3a4250}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);color:#04120a;border-color:var(--acc);font-weight:600}
button.icon{padding:8px 12px}
input[type=text]{width:100%;font:inherit;color:var(--text);background:#0f1217;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input[type=text]:focus{outline:none;border-color:var(--acc)}
.meta{display:flex;justify-content:space-between;margin-bottom:14px}
.bar{display:flex;height:34px;border-radius:999px;overflow:hidden;background:#2b2e2a}
.bseg{position:relative;background:#2b2e2a;border-right:1px solid rgba(0,0,0,.55)}
.bseg:last-child{border-right:0}
.bseg.unlocked{background:#2a7a4f}
.bseg .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:#21de77}
.blabels{display:flex;margin:6px 0 16px}
.blabels span{text-align:right;padding-right:10px;font-size:12px;color:var(--mut)}
.blabels span.cur{color:var(--acc);font-weight:600}
.controls{display:flex;gap:10px;margin-bottom:14px}
.controls .primary{flex:1;padding:14px}
.guessWrap{position:relative;margin-bottom:14px}
#suggest{position:absolute;left:0;right:0;top:100%;margin:6px 0 0;padding:4px;list-style:none;background:#1b1f26;border:1px solid var(--line);border-radius:10px;z-index:5;max-height:340px;overflow:auto}
#suggest li{padding:9px 10px;border-radius:7px;cursor:pointer}
#suggest li.sel,#suggest li:hover{background:#262c36}
#suggest li small{display:block;color:var(--mut)}
#history{list-style:none;margin:0;padding:0}
#history li{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;background:#12151a}
#history .x{color:var(--bad)} #history .sk{color:var(--mut)} #history .ok{color:var(--acc)}
#result{margin-top:14px;display:flex;gap:16px;align-items:center}
#result img{width:96px;height:96px;border-radius:8px;background:#222;object-fit:cover}
#resTitle{font-weight:700;font-size:18px}
#resHead{font-size:14px;margin-bottom:4px}
#resHead.win{color:var(--acc)} #resHead.lose{color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg{margin-top:12px;color:#ffb86b;font-size:14px;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#232831;border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mut)}
dialog .row{display:flex;gap:8px}
code{background:#0f1217;padding:2px 6px;border-radius:5px;font-size:13px;word-break:break-all}
input[type=range]{width:90px;accent-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Song<span>less</span></h1>
  <input type="range" id="vol" min="0" max="1" step="0.05" title="Volume">
  <button class="icon" id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <section id="login" class="card" hidden>
    <h2>Connect Spotify</h2>
    <p class="muted">Songs play through your own Spotify account, so you need Premium. Nothing is stored anywhere except in this browser.</p>
    <button class="primary" id="loginBtn">Log in with Spotify</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section id="start" class="card" hidden>
    <h2 id="hello">Ready?</h2>
    <p class="muted">This will create a "Songless" player in your browser and load the song list.</p>
    <button class="primary" id="startBtn">Start playing</button>
    <div class="msg" id="startMsg"></div>
  </section>

  <section id="game" class="card" hidden>
    <div class="meta"><span id="plName" class="muted"></span><span id="score" class="muted"></span></div>
    <div id="barWrap"></div>
    <div class="controls">
      <button class="primary" id="playBtn">▶ Play</button>
      <button id="skipBtn">Skip ⏭</button>
    </div>
    <div class="guessWrap">
      <input type="text" id="guess" placeholder="Search for the song…" autocomplete="off" spellcheck="false">
      <ul id="suggest" hidden></ul>
    </div>
    <ul id="history"></ul>
    <div id="result" hidden>
      <img id="art" alt="">
      <div>
        <div id="resHead"></div>
        <div id="resTitle"></div>
        <div id="resSub" class="muted"></div>
        <div class="btns">
          <button id="fullBtn">▶ Play full song</button>
          <button class="primary" id="nextBtn">Next song →</button>
        </div>
      </div>
    </div>
    <div class="msg" id="gameMsg"></div>
  </section>
</main>

<dialog id="settings">
  <h2 style="margin-top:0">Settings</h2>
  <div id="cidBlock">
    <label for="cidInput">Spotify Client ID</label>
    <div class="row"><input type="text" id="cidInput" placeholder="from developer.spotify.com/dashboard"><button id="cidSave">Save</button></div>
  </div>
  <label for="plInput">Playlist (link or ID). Leave empty to use the default list</label>
  <div class="row"><input type="text" id="plInput" placeholder="https://open.spotify.com/playlist/…"><button id="plLoad">Load</button></div>
  <div class="row" style="margin-top:8px"><button id="plReset">Use default</button><button id="exportBtn">Export songs.json</button></div>
  <label><input type="checkbox" id="randStart"> Start clips at a random point in the song (harder)</label>
  <label>Redirect URI to register in your Spotify app:</label>
  <code id="redirectUri"></code>
  <div class="row" style="margin-top:18px;justify-content:space-between">
    <button id="logoutBtn">Log out</button>
    <button class="primary" id="closeSettings">Close</button>
  </div>
</dialog>
<div id="toast"></div>

<script>
/* ============ CONFIG: edit these ============ */
const CONFIG = {
  CLIENT_ID: "ac6b87de5bba4f61977bb46ec8a761a4",          // your Spotify app's Client ID (so friends don't have to enter one)
  DEFAULT_PLAYLIST: "4qtgPVe9aCKzaGLBl1KJkY",   // playlist link or ID, used only if there is no songs.json next to this file
  INTERVALS: [0.2, 0.5, 2, 8, 15],  // clip length in seconds for each stage
};
/* ============================================ */

const $ = s => document.querySelector(s);
const INTERVALS = CONFIG.INTERVALS;
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastTimer;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600); }
function showView(name) { for (const v of ["login", "start", "game"]) $("#" + v).hidden = v !== name; }

/* ---------- Auth (Authorization Code + PKCE, no server or secret needed) ---------- */
const SCOPES = ["streaming", "user-read-email", "user-read-private", "user-modify-playback-state",
  "user-read-playback-state", "playlist-read-private", "playlist-read-collaborative"].join(" ");
const redirectUri = () => location.origin + location.pathname;
const clientId = () => CONFIG.CLIENT_ID || store.get("clientId") || "";

function b64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function randomString(n) {
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  return Array.from(a, x => abc[x % abc.length]).join("");
}

async function login() {
  const id = clientId();
  if (!id) { openSettings(); toast("Add your Spotify Client ID first"); return; }
  const verifier = randomString(64), state = randomString(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  store.set("pkce", { verifier, state });
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
    client_id: id, response_type: "code", redirect_uri: redirectUri(), scope: SCOPES,
    code_challenge_method: "S256", code_challenge: challenge, state,
  });
}

async function tokenRequest(params) {
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: clientId(), ...params }),
  });
  if (!res.ok) throw new Error("Spotify login failed (" + res.status + "). Check the Client ID and redirect URI.");
  const t = await res.json();
  const prev = store.get("auth") || {};
  store.set("auth", { access: t.access_token, refresh: t.refresh_token || prev.refresh, expires: Date.now() + t.expires_in * 1000 - 60000 });
}

async function handleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return null;
  history.replaceState({}, "", redirectUri());
  if (q.get("error")) return "Login was cancelled or denied (" + q.get("error") + ").";
  const pk = store.get("pkce");
  store.del("pkce");
  if (!pk || pk.state !== q.get("state")) return "Login state mismatch, please try again.";
  await tokenRequest({ grant_type: "authorization_code", code: q.get("code"), redirect_uri: redirectUri(), code_verifier: pk.verifier });
  return null;
}

async function getToken() {
  const a = store.get("auth");
  if (!a) return null;
  if (Date.now() < a.expires) return a.access;
  if (!a.refresh) return null;
  try { await tokenRequest({ grant_type: "refresh_token", refresh_token: a.refresh }); return store.get("auth").access; }
  catch { store.del("auth"); return null; }
}

async function api(path, opts = {}, retry = true) {
  const token = await getToken();
  if (!token) throw new Error("Not logged in");
  const res = await fetch(path.startsWith("http") ? path : "https://api.spotify.com/v1" + path, {
    ...opts, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (res.status === 429 && retry) {
    const wait = Math.min(parseInt(res.headers.get("Retry-After") || "2", 10), 10);
    await sleep(wait * 1000);
    return api(path, opts, false);
  }
  return res;
}

/* ---------- Song list ---------- */
function parsePlaylistId(s) {
  s = (s || "").trim();
  const m = s.match(/playlist[\/:]([A-Za-z0-9]+)/);
  if (m) return m[1];
  return /^[A-Za-z0-9]{15,30}$/.test(s) ? s : null;
}

async function loadPlaylist(id) {
  const out = [], seen = new Set();
  let offset = 0, limit = 50, total = Infinity;
  while (offset < total) {
    const res = await api(`/playlists/${id}/items?limit=${limit}&offset=${offset}&additional_types=track`);
    if (res.status === 400 && limit > 10) { limit = 10; continue; }
    if (res.status === 401) throw new Error("Spotify rejected the login. Log out in Settings and log in again.");
    if (res.status === 403 || res.status === 404) throw new Error(
      "Spotify wouldn't give this app that playlist's tracks.\n" +
      "Apps in development mode may only be able to read playlists you own or collaborate on. " +
      "Try a playlist you own (or make it collaborative), or use the exported songs.json.");
    if (!res.ok) throw new Error("Couldn't load the playlist (error " + res.status + ").");
    const data = await res.json();
    const rows = data.items || [];
    total = data.total ?? 0;
    for (const row of rows) {
      const t = row.item || row.track;   // "item" since Feb 2026, "track" before
      if (!t || t.type !== "track" || t.is_local || !t.uri || seen.has(t.uri)) continue;
      seen.add(t.uri);
      const imgs = t.album?.images || [];
      out.push({ uri: t.uri, id: t.id, name: t.name, artists: (t.artists || []).map(a => a.name),
        art: (imgs[1] || imgs[0] || {}).url || "", duration_ms: t.duration_ms || 0 });
    }
    if (!rows.length) break;
    offset += rows.length;
  }
  if (!out.length) throw new Error("That playlist has no playable songs.");
  let name = "Playlist";
  try { const r = await api(`/playlists/${id}?fields=name`); if (r.ok) name = (await r.json()).name || name; } catch {}
  return { name, songs: out };
}

async function loadSongs() {
  const custom = store.get("customPlaylist");
  if (custom) {
    const id = parsePlaylistId(custom);
    if (!id) throw new Error("The saved playlist link isn't valid. Fix it in Settings.");
    return loadPlaylist(id);
  }
  try {
    const r = await fetch("songs.json", { cache: "no-cache" });
    if (r.ok) {
      const d = await r.json();
      const songs = Array.isArray(d) ? d : d.songs;
      if (songs && songs.length) return { name: d.name || "Default playlist", songs };
    }
  } catch {}
  const id = parsePlaylistId(CONFIG.DEFAULT_PLAYLIST);
  if (id) return loadPlaylist(id);
  throw new Error("No song list yet. Open Settings and paste a playlist link.");
}

/* ---------- Spotify Web Playback SDK ---------- */
let player = null, deviceId = null;
const sdkLoaded = new Promise((res, rej) => {
  window.onSpotifyWebPlaybackSDKReady = res;
  window.__sdkFail = () => rej(new Error("Couldn't load the Spotify player script (ad blocker?)."));
});
function loadSdk() {
  if (document.getElementById("sdk")) return;
  const s = document.createElement("script");
  s.id = "sdk"; s.src = "https://sdk.scdn.co/spotify-player.js"; s.onerror = window.__sdkFail;
  document.head.appendChild(s);
}

const stateWaiters = new Set();
function onState(s) { if (s) [...stateWaiters].forEach(w => w(s)); }
function waitForState(pred, ms = 6000) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => { stateWaiters.delete(w); rej(new Error("timeout")); }, ms);
    const w = s => { if (pred(s)) { clearTimeout(t); stateWaiters.delete(w); res(s); } };
    stateWaiters.add(w);
  });
}
const volume = () => store.get("vol", 0.5);

async function connectPlayer() {
  await sdkLoaded;
  player = new Spotify.Player({ name: "Songless", volume: volume(), getOAuthToken: async cb => cb(await getToken()) });
  const ready = new Promise((res, rej) => {
    player.addListener("ready", ({ device_id }) => { deviceId = device_id; res(); });
    player.addListener("not_ready", () => { deviceId = null; });
    player.addListener("initialization_error", e => rej(new Error(e.message)));
    player.addListener("authentication_error", () => { store.del("auth"); rej(new Error("Spotify login expired. Reload the page and log in again.")); });
    player.addListener("account_error", () => rej(new Error("Spotify says this account can't stream in the browser. Web playback needs Premium.")));
    setTimeout(() => rej(new Error("Timed out waiting for the Spotify player.")), 20000);
  });
  player.addListener("player_state_changed", onState);
  player.activateElement();   // unlocks audio; must run right after a click
  if (!(await player.connect())) throw new Error("Couldn't connect the Spotify player.");
  await ready;
}

async function startPlayback(uri, positionMs) {
  const body = JSON.stringify({ uris: [uri], position_ms: positionMs });
  let res = await api(`/me/player/play?device_id=${deviceId}`, { method: "PUT", body });
  if (res.status === 404) {   // device not active yet: transfer to it, then retry
    await api("/me/player", { method: "PUT", body: JSON.stringify({ device_ids: [deviceId], play: false }) });
    await sleep(600);
    res = await api(`/me/player/play?device_id=${deviceId}`, { method: "PUT", body });
  }
  if (res.status === 403) throw new Error("Spotify refused to play (Premium required, or this account isn't allowlisted).");
  if (!res.ok) throw new Error("Couldn't start playback (error " + res.status + ").");
}

/* Load the track while muted, park it paused at the start point, so clips begin instantly. */
async function prepare(g) {
  const s = g.song;
  await player.setVolume(0);
  const loaded = waitForState(st => {
    const c = st.track_window.current_track;
    return !st.paused && c && (c.uri === s.uri || c.linked_from?.uri === s.uri || c.id === s.id);
  });
  try {
    await startPlayback(s.uri, g.startMs);
    await loaded.catch(() => {});
  } finally {
    await player.pause();
    await player.seek(g.startMs);
    await player.setVolume(volume());
  }
}

/* ---------- Game ---------- */
let songs = [], queue = [], G = null, clipTimer = null, playing = false, fullPlaying = false, loading = false;
let clipToken = 0, heard = 0, raf = 0;   // heard = seconds of the bar already "used up" (shown bright when idle)
let stats = store.get("stats", { rounds: 0, wins: 0 });

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickSong = () => { if (!queue.length) queue = shuffle(songs.slice()); return queue.pop(); };
const sameSong = (a, b) => a.uri === b.uri || (norm(a.name) === norm(b.name) && norm(a.artists[0]) === norm(b.artists[0]));
const label = s => `${s.name} – ${s.artists.join(", ")}`;
const fmt = n => (n < 1 ? n.toFixed(1) : String(n)) + "s";

function setSongs(list) {
  songs = list.map(s => ({ ...s, _k: norm(s.name + " " + s.artists.join(" ")) }));
  queue = [];
}

async function newRound() {
  cancelClip(); fullPlaying = false; heard = 0;
  try { await player.pause(); } catch {}
  const song = pickSong();
  const dur = song.duration_ms || 0;
  const startMs = store.get("randomStart", false) && dur > 45000 ? Math.floor(5000 + Math.random() * (dur - 35000)) : 0;
  G = { song, startMs, stage: 0, guesses: [], over: false, won: false, ready: false };
  $("#gameMsg").textContent = "";
  $("#guess").value = ""; hideSuggest();
  loading = true; render();
  try { await prepare(G); G.ready = true; }
  catch (e) { $("#gameMsg").textContent = e.message; }
  loading = false; render();
  if (G.ready) $("#guess").focus();
}

/* Progress bar: five segments (widths roughly follow the look of the reference), unlocked ones dark green,
   the part already heard bright green, locked ones grey. */
const BAR_WEIGHTS = [48, 79, 105, 133, 147];
function buildBar() {
  const bar = document.createElement("div"); bar.id = "bar"; bar.className = "bar";
  const labels = document.createElement("div"); labels.id = "blabels"; labels.className = "blabels";
  INTERVALS.forEach((n, i) => {
    const w = BAR_WEIGHTS[i] || 100;
    const seg = document.createElement("div"); seg.className = "bseg"; seg.style.flex = `${w} 1 0`;
    const fill = document.createElement("div"); fill.className = "fill"; seg.append(fill); bar.append(seg);
    const lb = document.createElement("span"); lb.style.flex = `${w} 1 0`; lb.textContent = fmt(n); labels.append(lb);
  });
  $("#barWrap").append(bar, labels);
}
function drawBar(p) {   // p = seconds of the clip timeline to show as filled
  let lo = 0;
  [...$("#bar").children].forEach((el, i) => {
    const hi = INTERVALS[i];
    el.firstChild.style.width = Math.max(0, Math.min(1, (p - lo) / (hi - lo))) * 100 + "%";
    lo = hi;
  });
}

function cancelClip() {
  clipToken++; clearTimeout(clipTimer); cancelAnimationFrame(raf); playing = false;
}

async function playClip() {
  if (!G || !G.ready || G.over) return;
  const sec = INTERVALS[G.stage];
  cancelClip();
  const token = clipToken;
  playing = true; renderPlay();
  try {
    await player.pause();          // always start from a clean, paused state
    await player.seek(G.startMs);
    // Spotify can drop a resume that comes right after a very short pause, so confirm it started and retry if not.
    let started = null;
    for (let i = 0; i < 3 && !started; i++) {
      const confirmed = waitForState(s => !s.paused, 1200).catch(() => null);
      await player.resume();
      started = await confirmed;
      if (token !== clipToken) return;
    }
    if (!started) throw new Error("Spotify didn't start the clip. Press Play again.");
    // The clip timer starts only once playback is confirmed, so short clips get their full length.
    const t0 = performance.now();
    const tick = () => {
      if (token !== clipToken) return;
      const p = Math.min(sec, (performance.now() - t0) / 1000);
      drawBar(p);
      if (p < sec) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    clipTimer = setTimeout(async () => {
      if (token !== clipToken) return;
      try { await player.pause(); } catch {}
      if (token !== clipToken) return;
      playing = false; heard = sec; drawBar(heard); renderPlay();
    }, sec * 1000);
  } catch (e) {
    if (token === clipToken) { playing = false; renderPlay(); $("#gameMsg").textContent = e.message; }
  }
}

function advance() {
  cancelClip();
  player.pause().catch(() => {});
  if (G.stage >= INTERVALS.length - 1) return endRound(false);
  G.stage++; heard = INTERVALS[G.stage - 1]; render();   // unlock the next clip; the player presses Play to hear it
}

function submitGuess(song) {
  if (!G || G.over || !G.ready) return;
  if (G.guesses.some(g => g.song && g.song.uri === song.uri)) { toast("You already guessed that one"); return; }
  const correct = sameSong(song, G.song);
  G.guesses.push({ song, correct });
  $("#guess").value = ""; hideSuggest();
  if (correct) return endRound(true);
  advance();
}

function skip() {
  if (!G || G.over || !G.ready) return;
  G.guesses.push({ skipped: true });
  advance();
}

async function endRound(won) {
  G.over = true; G.won = won;
  cancelClip();
  try { await player.pause(); } catch {}
  stats.rounds++; if (won) stats.wins++;
  store.set("stats", stats);
  render();
}

async function toggleFull() {
  if (!G || !G.over) return;
  try {
    if (fullPlaying) { await player.pause(); fullPlaying = false; }
    else { await player.seek(G.startMs); await player.resume(); fullPlaying = true; }
  } catch (e) { $("#gameMsg").textContent = e.message; }
  renderPlay();
}

/* ---------- Rendering (all text via textContent, never innerHTML) ---------- */
function renderPlay() {
  const b = $("#playBtn");
  if (!G) return;
  b.disabled = loading || !G.ready || G.over;
  b.textContent = loading ? "Loading song…" : playing ? "♪ Playing…" : `▶ Play ${fmt(INTERVALS[Math.min(G.stage, INTERVALS.length - 1)])}`;
  $("#fullBtn").textContent = fullPlaying ? "⏸ Pause" : "▶ Play full song";
}

function render() {
  if (!G) return;
  [...$("#bar").children].forEach((el, i) => el.classList.toggle("unlocked", i <= G.stage));
  [...$("#blabels").children].forEach((el, i) => el.classList.toggle("cur", i === G.stage && !G.over));
  if (!playing) drawBar(G.over ? INTERVALS[G.stage] : heard);
  const h = $("#history");
  h.replaceChildren(...G.guesses.map(g => {
    const li = document.createElement("li");
    const ic = document.createElement("span"), tx = document.createElement("span");
    if (g.skipped) { ic.className = "sk"; ic.textContent = "⏭"; tx.textContent = "Skipped"; }
    else { ic.className = g.correct ? "ok" : "x"; ic.textContent = g.correct ? "✓" : "✗"; tx.textContent = label(g.song); }
    li.append(ic, tx); return li;
  }));
  $("#guess").disabled = G.over || loading;
  $("#skipBtn").disabled = G.over || loading || !G.ready;
  $("#score").textContent = `Won ${stats.wins} of ${stats.rounds}`;
  const r = $("#result");
  r.hidden = !G.over;
  if (G.over) {
    const head = $("#resHead");
    head.className = G.won ? "win" : "lose";
    const tries = G.guesses.length;
    head.textContent = G.won ? `Got it in ${tries} ${tries === 1 ? "guess" : "guesses"}!` : "Out of guesses";
    $("#resTitle").textContent = G.song.name;
    $("#resSub").textContent = G.song.artists.join(", ");
    const art = $("#art"); art.src = G.song.art || ""; art.style.visibility = G.song.art ? "visible" : "hidden";
  }
  renderPlay();
}

/* ---------- Autocomplete ---------- */
let suggestions = [], selIdx = -1;
function hideSuggest() { $("#suggest").hidden = true; suggestions = []; selIdx = -1; }
function updateSuggest() {
  const q = norm($("#guess").value);
  if (!q) return hideSuggest();
  const toks = q.split(" ");
  suggestions = songs.filter(s => toks.every(t => s._k.includes(t)))
    .sort((a, b) => (norm(b.name).startsWith(q) ? 1 : 0) - (norm(a.name).startsWith(q) ? 1 : 0)).slice(0, 8);
  selIdx = suggestions.length ? 0 : -1;
  const ul = $("#suggest");
  ul.replaceChildren(...suggestions.map((s, i) => {
    const li = document.createElement("li");
    if (i === selIdx) li.className = "sel";
    li.append(document.createTextNode(s.name));
    const sm = document.createElement("small"); sm.textContent = s.artists.join(", "); li.append(sm);
    li.addEventListener("mousedown", e => { e.preventDefault(); submitGuess(s); });
    return li;
  }));
  ul.hidden = !suggestions.length;
}
function moveSel(d) {
  if (!suggestions.length) return;
  selIdx = (selIdx + d + suggestions.length) % suggestions.length;
  [...$("#suggest").children].forEach((li, i) => li.classList.toggle("sel", i === selIdx));
}

/* ---------- Settings ---------- */
function openSettings() {
  $("#cidBlock").hidden = !!CONFIG.CLIENT_ID;
  $("#cidInput").value = store.get("clientId", "");
  $("#plInput").value = store.get("customPlaylist", "") || "";
  $("#randStart").checked = store.get("randomStart", false);
  $("#redirectUri").textContent = redirectUri();
  $("#settings").showModal();
}
async function reloadSongs() {
  $("#settings").close();
  if (!player) return;
  showView("game"); loading = true; $("#gameMsg").textContent = "Loading songs…";
  try {
    const { name, songs: list } = await loadSongs();
    setSongs(list); $("#plName").textContent = `${name} · ${songs.length} songs`;
    await newRound();
  } catch (e) { loading = false; $("#gameMsg").textContent = e.message; }
}

/* ---------- Boot ---------- */
async function startSession() {
  const msg = $("#startMsg");
  $("#startBtn").disabled = true;
  try {
    msg.textContent = "Connecting to Spotify…";
    await connectPlayer();
    msg.textContent = "Loading songs…";
    const { name, songs: list } = await loadSongs();
    setSongs(list); $("#plName").textContent = `${name} · ${songs.length} songs`;
    showView("game");
    await newRound();
  } catch (e) {
    msg.textContent = e.message; $("#startBtn").disabled = false;
    if (/Settings/.test(e.message)) { $("#startBtn").textContent = "Try again"; }
  }
}

async function boot() {
  $("#vol").value = volume();
  $("#redirectUri").textContent = redirectUri();
  let err = null;
  try { err = await handleRedirect(); } catch (e) { err = e.message; }
  const tok = await getToken();
  if (!tok) { showView("login"); $("#loginMsg").textContent = err || ""; return; }
  loadSdk();
  showView("start");
  try {
    const res = await api("/me");
    if (res.status === 403) {
      store.del("auth"); showView("login");
      $("#loginMsg").textContent = "This Spotify account isn't on the app's allowlist. Ask the app owner to add your name and email under User Management in the Spotify developer dashboard.";
      return;
    }
    if (res.ok) {
      const me = await res.json();
      $("#hello").textContent = "Hi " + (me.display_name || "there") + "!";
      if (me.product && me.product !== "premium") $("#startMsg").textContent = "Heads up: this account doesn't look like Premium, so playback will probably fail.";
    }
  } catch {}
}

$("#loginBtn").onclick = login;
$("#startBtn").onclick = startSession;
$("#playBtn").onclick = playClip;
$("#skipBtn").onclick = skip;
$("#nextBtn").onclick = newRound;
$("#fullBtn").onclick = toggleFull;
$("#settingsBtn").onclick = openSettings;
$("#closeSettings").onclick = () => $("#settings").close();
$("#vol").oninput = e => { store.set("vol", +e.target.value); if (player) player.setVolume(+e.target.value); };
$("#cidSave").onclick = () => { store.set("clientId", $("#cidInput").value.trim()); toast("Client ID saved"); };
$("#randStart").onchange = e => store.set("randomStart", e.target.checked);
$("#plLoad").onclick = () => {
  const v = $("#plInput").value.trim();
  if (!parsePlaylistId(v)) { toast("That doesn't look like a playlist link"); return; }
  store.set("customPlaylist", v); reloadSongs();
};
$("#plReset").onclick = () => { store.del("customPlaylist"); $("#plInput").value = ""; reloadSongs(); };
$("#logoutBtn").onclick = () => { store.del("auth"); location.reload(); };
$("#exportBtn").onclick = () => {
  if (!songs.length) { toast("Load a playlist first"); return; }
  const data = { name: $("#plName").textContent.split(" · ")[0], songs: songs.map(({ _k, ...s }) => s) };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  a.download = "songs.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("#guess").addEventListener("input", updateSuggest);
$("#guess").addEventListener("blur", () => setTimeout(hideSuggest, 100));
$("#guess").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
  else if (e.key === "Enter") { e.preventDefault(); if (suggestions[selIdx]) submitGuess(suggestions[selIdx]); }
  else if (e.key === "Escape") hideSuggest();
});

buildBar();
boot();
</script>
</body>
</html>
